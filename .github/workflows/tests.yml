# The kit's tests, and every view of each bench, run with the kit as pushed in place of the
# bench's own copy, so a change that would break a bench shows here before the bench moves to it.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { bench: critical-code-studies/bench-template, kit: research/kit, dir: research }
          - { bench: critical-code-studies/SHRDLU, kit: research/kit, dir: research }
          - { bench: spacewar1962/spacewar, kit: research/kit, dir: research }
          - { bench: critical-code-studies/ELIZA, kit: research/kit, dir: research }
          - { bench: vector-humanities/melville, kit: kit, dir: . }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.bench }}
          path: bench
      - uses: actions/checkout@v4
        with:
          path: bench/${{ matrix.kit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        working-directory: bench
        run: node ${{ matrix.kit }}/tools/test.js --dir ${{ matrix.dir }}
      # every view the bench has, opened with the kit as pushed: a change that breaks a bench's views
      # shows here before the bench moves to it
      - name: Views
        working-directory: bench
        run: node ${{ matrix.kit }}/tools/views.js --dir ${{ matrix.dir }}
